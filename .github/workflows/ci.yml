name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.runner }} / Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: '16.4'
          - runner: macos-15-intel
            xcode: '16.4'
          - runner: macos-26
            xcode: '26.4.1'
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: ./scripts/test.sh
      - name: Package the app
        run: ./scripts/build.sh
      - name: Verify the distributable ZIP
        run: |
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          ditto -x -k "dist/Xcode Presence.zip" "$stage"
          codesign --verify --deep --strict "$stage/Xcode Presence.app"
          test -f "$stage/Xcode Presence.app/Contents/Resources/ThirdPartyNotices.txt"

  formatting:
    runs-on: macos-26
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: ./scripts/format.sh --check
